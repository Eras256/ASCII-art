name: Validate ASCII art

on:
  pull_request:
    paths:
      - "art/**"
      - "scripts/validate.py"
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate.py
